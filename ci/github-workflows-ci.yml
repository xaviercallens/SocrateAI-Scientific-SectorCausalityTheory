name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lean:
    name: Lean build (116 theorems, standard axioms only)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Fetch Mathlib cache (pinned by lean/lake-manifest.json)
        working-directory: lean
        run: lake exe cache get
      - name: Build
        working-directory: lean
        run: lake build 2>&1 | tee build.log
      - name: Standard axioms only, no sorry, all 116 theorems audited
        run: python3 scripts/check_build_log.py lean/build.log --expect 116

  mcp-server:
    name: MCP server tests (case table matches the paper; planted-defect controls fail)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install and test
        working-directory: mcp-server
        env:
          SCT_REPO_ROOT: ${{ github.workspace }}
        run: |
          pip install -e . pytest
          python -m pytest -q -rs

  notebooks:
    name: Reproduction notebooks execute top to bottom (outputs written to a scratch dir, not committed)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Execute all notebooks
        working-directory: notebooks
        run: |
          pip install -r requirements.txt
          for nb in 01_criterion_compact_boson 02_interventional_experiment 03_cmb_cascade_reproduction; do
            jupyter nbconvert --to notebook --execute "$nb.ipynb" --output-dir /tmp/nbout --output "$nb"
          done

  audit:
    name: Generated files are up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/regen_axiom_audit.py --check
      - run: python3 scripts/make_references.py --check
