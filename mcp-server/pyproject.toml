[project]
name = "sector-causality-mcp"
version = "0.1.0"
description = "MCP server for the Sector Causality Theory: case table, criterion, Lean theorems, kernel checks, reproductions"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Xavier Callens" }]
dependencies = ["mcp>=2.0"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
sector-causality-mcp = "sector_causality_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sector_causality_mcp"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
